version: '3.8'

services:
  # All-in-one Tutanota service (frontend + backend + CORS proxy)
  # Use BUILD_BRANCH environment variable to switch branches (default: sean-dev1)
  # Example: BUILD_BRANCH=no-antiphishing-header docker-compose up --build
  tutanota:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_BRANCH: ${BUILD_BRANCH:-sean-dev1}
    ports:
      - "9000:9000"  # Frontend
      - "3000:3000"  # Backend (trusted-senders-backend)
      - "8080:8080"  # CORS proxy
    networks:
      - tutanota-network
    volumes:
      - backend-data:/app/trusted-senders-backend/data
      - ./trusted-senders-backend/.env:/app/trusted-senders-backend/.env
    restart: unless-stopped

  # Optional: Frontend-only service (alternative to all-in-one)
  frontend-only:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "9001:9000"  # Different port to avoid conflict
    networks:
      - tutanota-network
    restart: unless-stopped
    profiles:
      - frontend-only

networks:
  tutanota-network:
    driver: bridge

volumes:
  backend-data:
    driver: local 